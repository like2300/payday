{% extends "base.html" %}

{% block title %}Page non trouvée | Haram{% endblock %}

{% block header_content %}
<div class="flex justify-center flex-1">
    <h2 class="text-white/40 font-semibold tracking-widest text-xs uppercase">Erreur 404</h2>
</div>
{% endblock %}

{% block content %}
<div class="h-[calc(100vh-200px)] flex flex-col items-center justify-center text-center px-6 transition-colors duration-300">
    <div class="glass dark:bg-white/5 dark:border-white/10 p-12 rounded-[40px] max-w-lg space-y-8 shadow-2xl animate-slide-up">
        <h1 class="text-9xl font-black text-gray-900 dark:text-white opacity-10 tracking-tighter">404</h1>
        <div class="space-y-3">
            <h2 class="text-3xl font-black text-gray-900 dark:text-white uppercase tracking-tighter">Oups ! Page introuvable</h2>
            <p class="text-gray-500 dark:text-white/40 font-medium">La page que vous recherchez semble avoir disparu ou l'URL est incorrecte.</p>
        </div>
        <div class="pt-6">
            <a href="{% url 'fundraiser_list' %}" class="inline-block py-5 px-10 bg-black dark:bg-white text-white dark:text-black font-black uppercase tracking-widest text-[10px] rounded-2xl hover:opacity-80 transition-all shadow-xl active:scale-95">
                Retour à l'accueil
            </a>
        </div>
    </div>
</div>
{% endblock %}
