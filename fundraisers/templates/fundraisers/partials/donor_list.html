{% for txn in page_obj %}
    <div class="p-6 bg-[var(--bg-surface-alt)] border border-[var(--border-subtle)] rounded-[32px] animate-fadeIn group hover:scale-[1.01] transition-all duration-300">
        <div class="flex justify-between items-start mb-4">
            <div>
                <p class="text-lg font-black uppercase tracking-tighter text-[var(--text-main)]">{{ txn.donor_name|default:"Anonyme" }}</p>
                <p class="text-[10px] font-bold uppercase tracking-widest text-[var(--text-muted)]">{{ txn.created_at|date:"d M Y, H:i" }}</p>
            </div>
            <p class="text-xl font-black text-[var(--accent-primary)]">{{ txn.amount|floatformat:0 }} <span class="text-[10px] text-[var(--text-muted)]">FCFA</span></p>
        </div>
        
        {% if txn.message %}
            <div class="relative mt-4 pt-4 border-t border-[var(--border-subtle)]">
                <span class="material-icons absolute -top-3 left-4 bg-[var(--bg-surface-alt)] px-2 text-[var(--text-muted)] text-lg">format_quote</span>
                <p class="text-sm text-[var(--text-muted)] leading-relaxed italic font-medium">
                    {{ txn.message }}
                </p>
            </div>
        {% endif %}
    </div>
{% empty %}
    <div class="py-12 text-center space-y-3">
        <div class="text-4xl">🎁</div>
        <p class="text-[var(--text-muted)] font-medium">Aucun donateur trouvé</p>
    </div>
{% endfor %}
